backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main
  base_url: https://YOUR-OAUTH-HOST.example.com
  auth_endpoint: auth
media_folder: "public/images"
public_folder: "/images"
site_url: https://YOUR-PUBLISHED-DOMAIN.example.com
display_url: https://YOUR-PUBLISHED-DOMAIN.example.com
publish_mode: editorial_workflow
collections:
  - name: "site"
    label: "Website content"
    files:
      - name: "settings"
        label: "Homepage and business details"
        file: "public/data/site.json"
        format: "json"
        fields:
          - {label: "Business name", name: "businessName", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Announcement bar", name: "announcement", widget: "string", required: false}
          - {label: "Facebook page URL", name: "facebook", widget: "string"}
          - {label: "Location", name: "location", widget: "string", required: false}
          - {label: "Phone", name: "phone", widget: "string", required: false}
          - {label: "Email", name: "email", widget: "string", required: false}
          - {label: "Business hours", name: "hours", widget: "string", required: false}
          - {label: "Hero headline", name: "heroTitle", widget: "string"}
          - {label: "Hero description", name: "heroText", widget: "text"}
          - {label: "Story heading", name: "storyTitle", widget: "string"}
          - {label: "Story text", name: "storyText", widget: "text"}
          - {label: "Promotion heading", name: "promoTitle", widget: "string"}
          - {label: "Promotion text", name: "promoText", widget: "text"}
          - {label: "Promotion image", name: "promoImage", widget: "image", required: false}
  - name: "menu"
    label: "Menu and products"
    files:
      - name: "menu-items"
        label: "Menu items"
        file: "public/data/menu.json"
        format: "json"
        fields:
          - label: "Menu items"
            name: "menu"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - {label: "ID (unique, no spaces)", name: "id", widget: "string"}
              - {label: "Item name", name: "name", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false}

  - name: "reviews"
    label: "Customer reviews"
    files:
      - name: "review-list"
        label: "Verified customer reviews"
        file: "public/data/reviews.json"
        format: "json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            required: false
            fields:
              - {label: "Customer display name (with permission)", name: "name", widget: "string"}
              - {label: "Exact review text", name: "quote", widget: "text"}
